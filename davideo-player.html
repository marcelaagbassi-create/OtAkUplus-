<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Davideo.net</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{background:#0f0f0f;width:100%;font-family:'Outfit',sans-serif;}

        #dv-wrap{position:relative;width:100%;background:#000;}

        #dv-bright-ov{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity .1s;}

        /* ══ LOGO ══ */
        .dv-logo{
            position:absolute;top:14px;right:14px;z-index:6;pointer-events:none;
            font-family:'Bangers',cursive;font-size:1.6rem;letter-spacing:3px;
            color:rgba(255,255,255,0.22);
            text-shadow:0 0 18px rgba(255,140,0,0.25),2px 2px 0 rgba(0,0,0,0.6);
        }
        .dv-logo em{color:rgba(255,140,0,0.5);font-style:normal;}

        /* ══ LANG SWITCH BADGE (top-left) ══ */
        #lang-switch-badge{
            position:absolute;top:14px;left:14px;z-index:6;
            display:flex;gap:6px;flex-wrap:wrap;
        }
        .lang-badge-btn{
            font-family:'Bangers',cursive;font-size:0.95rem;letter-spacing:2px;
            padding:4px 13px;border-radius:999px;cursor:pointer;
            border:1.5px solid rgba(255,255,255,0.2);
            background:rgba(0,0,0,0.5);
            color:rgba(255,255,255,0.55);
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            transition:all .18s;
        }
        .lang-badge-btn:hover{border-color:rgba(255,140,0,0.6);color:#ff8c00;}
        .lang-badge-btn.active{
            background:rgba(255,140,0,0.22);
            border-color:#ff8c00;color:#ff8c00;
            text-shadow:0 0 10px rgba(255,140,0,0.4);
        }
        .lang-badge-btn.unavail{
            opacity:0.28;cursor:not-allowed;
            border-color:rgba(255,255,255,0.08);
        }
        .lang-badge-btn.unavail:hover{border-color:rgba(255,255,255,0.08);color:rgba(255,255,255,0.28);}

        /* ══ LOADER ══ */
        #dv-loader{
            display:none;position:absolute;inset:0;z-index:7;
            align-items:center;justify-content:center;flex-direction:column;gap:12px;
            background:rgba(0,0,0,0.65);
        }
        #dv-loader.show{display:flex;}
        .spinner{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,140,0,0.2);border-top-color:#ff8c00;animation:spin .8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .loader-txt{font-size:0.72rem;letter-spacing:2px;color:rgba(255,255,255,0.4);text-transform:uppercase;}

        /* ══ LANG SWITCH TOAST ══ */
        #lang-toast{
            display:none;position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);z-index:9;
            background:rgba(0,0,0,0.78);backdrop-filter:blur(14px);
            border:1px solid rgba(255,140,0,0.4);border-radius:14px;
            padding:14px 28px;text-align:center;
            flex-direction:column;gap:6px;
        }
        #lang-toast.show{display:flex;}
        #lang-toast .lt-icon{font-size:1.6rem;}
        #lang-toast .lt-label{
            font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:3px;color:#ff8c00;
        }
        #lang-toast .lt-sub{font-size:0.7rem;letter-spacing:1px;color:rgba(255,255,255,0.4);text-transform:uppercase;}

        /* ══ PLACEHOLDER ══ */
        #dv-placeholder{
            display:flex;position:absolute;inset:0;z-index:3;
            align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000;
        }
        #dv-placeholder svg{opacity:0.12;}
        #dv-placeholder p{font-size:0.72rem;letter-spacing:2px;color:rgba(255,255,255,0.18);text-transform:uppercase;}

        /* ══ ERROR ══ */
        #dv-error{
            display:none;position:absolute;bottom:130px;left:50%;transform:translateX(-50%);z-index:8;
            background:rgba(160,20,20,0.9);backdrop-filter:blur(10px);
            border:1px solid rgba(255,80,80,0.4);border-radius:999px;
            padding:7px 20px;font-size:0.74rem;letter-spacing:1px;color:#fff;white-space:nowrap;
        }
        #dv-error.show{display:block;}

        /* ══ PiP BADGE ══ */
        #pip-badge{
            display:none;position:absolute;bottom:130px;right:14px;z-index:6;
            background:rgba(255,140,0,0.15);border:1px solid rgba(255,140,0,0.4);
            border-radius:999px;padding:4px 12px;font-size:0.68rem;font-weight:700;
            letter-spacing:1px;color:#ff8c00;backdrop-filter:blur(8px);
        }
        #pip-badge.show{display:block;}

        /* ══ VIDEO ══ */
        #dv-video{display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:contain;cursor:pointer;}

        /* ══ BAR ══ */
        #dv-bar{
            width:100%;background:rgba(10,10,10,0.86);
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-top:1px solid rgba(255,255,255,0.06);
            padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px;
        }

        /* Seek */
        .seek-row{display:flex;align-items:center;gap:10px;}
        #dv-seek{
            flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;
            background:rgba(255,255,255,0.18);outline:none;cursor:pointer;transition:height .15s;
        }
        #dv-seek:hover{height:7px;}
        #dv-seek::-webkit-slider-thumb{
            -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
            background:#ff8c00;cursor:pointer;box-shadow:0 0 8px rgba(255,140,0,0.5);
        }
        #dv-time{font-size:0.72rem;font-weight:600;color:rgba(255,255,255,0.4);white-space:nowrap;min-width:86px;text-align:right;letter-spacing:.4px;}

        /* PILL */
        .pill{
            display:inline-flex;align-items:center;justify-content:center;gap:5px;
            padding:6px 13px;border-radius:999px;
            border:1px solid rgba(255,255,255,0.13);
            background:rgba(255,255,255,0.07);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            color:rgba(255,255,255,0.8);font-family:'Outfit',sans-serif;
            font-size:0.72rem;font-weight:600;letter-spacing:.6px;
            cursor:pointer;white-space:nowrap;
            transition:background .15s,border-color .15s,color .15s,transform .1s;
        }
        .pill:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.28);color:#fff;}
        .pill:active{transform:scale(0.94);}
        .pill.ico{padding:7px 10px;}
        .pill.active{background:rgba(255,140,0,0.18);border-color:rgba(255,140,0,0.5);color:#ff8c00;}
        .pill.active svg{stroke:#ff8c00!important;fill:#ff8c00!important;}
        .pill svg.s{fill:none;stroke:rgba(255,255,255,0.8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
        .pill svg.f{fill:rgba(255,255,255,0.8);stroke:none;}
        .pill:hover svg.s{stroke:#fff;}
        .pill:hover svg.f{fill:#fff;}
        .pill.disabled{opacity:0.28;cursor:not-allowed;pointer-events:none;}

        /* range pill */
        .range-pill{
            display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
            border:1px solid rgba(255,255,255,0.13);background:rgba(255,255,255,0.07);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        }
        .range-pill input[type=range]{
            width:55px;height:4px;-webkit-appearance:none;appearance:none;
            border-radius:999px;background:rgba(255,255,255,0.2);outline:none;cursor:pointer;
        }
        .range-pill input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer;}
        #dv-bright-range::-webkit-slider-thumb{background:#ffd080;}

        .btn-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
        .spc{flex:1;}

        /* ── LANG ROW dans la barre ── */
        .lang-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
        .row-sep{width:1px;height:18px;background:rgba(255,255,255,0.1);margin:0 2px;flex-shrink:0;}
        .row-lbl{font-size:0.62rem;font-weight:600;letter-spacing:1.5px;color:rgba(255,255,255,0.25);text-transform:uppercase;white-space:nowrap;}

        /* ── Audio lang pill dans la barre ── */
        .audio-pill{
            display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;
            border:1px solid rgba(255,255,255,0.13);background:rgba(255,255,255,0.07);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            color:rgba(255,255,255,0.8);font-family:'Outfit',sans-serif;
            font-size:0.72rem;font-weight:700;letter-spacing:1px;
            cursor:pointer;white-space:nowrap;
            transition:all .18s;position:relative;
        }
        .audio-pill:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.3);color:#fff;}
        .audio-pill:active{transform:scale(0.94);}
        .audio-pill.active{background:rgba(255,140,0,0.18);border-color:rgba(255,140,0,0.5);color:#ff8c00;}
        .audio-pill.active svg{stroke:#ff8c00!important;}
        .audio-pill.unavail{opacity:0.28;cursor:not-allowed;}
        .audio-pill.unavail:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.13);color:rgba(255,255,255,0.4);}
        .audio-pill .avail-dot{
            width:6px;height:6px;border-radius:50%;background:#3d3d3d;flex-shrink:0;
            transition:background .18s;
        }
        .audio-pill.active .avail-dot{background:#ff8c00;box-shadow:0 0 6px rgba(255,140,0,0.6);}
        .audio-pill.has-src .avail-dot{background:#4caf50;}
        .audio-pill.active.has-src .avail-dot{background:#ff8c00;box-shadow:0 0 6px rgba(255,140,0,0.6);}

        /* POPUP MENUS */
        .dv-pop{
            display:none;position:absolute;z-index:30;
            background:rgba(12,12,12,0.95);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
            border:1px solid rgba(255,255,255,0.1);border-radius:14px;
            overflow:hidden;min-width:120px;box-shadow:0 8px 32px rgba(0,0,0,0.6);
        }
        .dv-pop.open{display:block;}
        .pop-title{padding:8px 14px 5px;font-size:0.6rem;font-weight:700;letter-spacing:1.5px;color:rgba(255,255,255,0.28);text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.06);}
        .pop-opt{
            display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;
            background:none;border:none;color:rgba(255,255,255,0.72);
            font-family:'Outfit',sans-serif;font-size:0.82rem;font-weight:500;
            cursor:pointer;text-align:left;transition:background .1s,color .1s;
        }
        .pop-opt:hover{background:rgba(255,255,255,0.07);color:#fff;}
        .pop-opt.active{color:#ff8c00;}
        .pop-opt .chk{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
        .pop-opt .bdg{margin-left:auto;font-size:0.58rem;letter-spacing:.8px;color:#ff8c00;background:rgba(255,140,0,0.13);border:1px solid rgba(255,140,0,0.28);border-radius:999px;padding:1px 7px;}

        #pop-speed{bottom:150px;right:115px;}
        #pop-quality{bottom:150px;right:8px;}
    </style>
</head>
<body>
<div id="dv-wrap">

    <div id="dv-bright-ov"></div>
    <div class="dv-logo">Da<em>VIDEO</em>.NET</div>

    <!-- LANG SWITCH — top left, visible sur la vidéo -->
    <div id="lang-switch-badge">
        <button class="lang-badge-btn active" id="badge-vostfr" onclick="switchAudio('VOSTFR')">VOSTFR</button>
        <button class="lang-badge-btn unavail" id="badge-vf"     onclick="switchAudio('VF')">VF</button>
        <button class="lang-badge-btn unavail" id="badge-vo"     onclick="switchAudio('VO')">VO</button>
    </div>

    <!-- LANG TOAST (centre écran lors du switch) -->
    <div id="lang-toast">
        <span class="lt-icon" id="lt-icon">🌐</span>
        <span class="lt-label" id="lt-label">VOSTFR</span>
        <span class="lt-sub" id="lt-sub">Changement de piste audio...</span>
    </div>

    <!-- Loader -->
    <div id="dv-loader">
        <div class="spinner"></div>
        <span class="loader-txt" id="loader-txt">Chargement...</span>
    </div>

    <!-- Placeholder -->
    <div id="dv-placeholder">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <p>En attente de la source vidéo</p>
    </div>

    <!-- Error -->
    <div id="dv-error">⚠ Source indisponible — essaie une autre piste</div>

    <!-- PiP badge -->
    <div id="pip-badge">● PiP ACTIF</div>

    <!-- VIDEO -->
    <video id="dv-video" preload="auto" playsinline
           style="display:block;width:100%;aspect-ratio:16/9;background:#000;object-fit:contain;cursor:pointer;">
    </video>

    <!-- POPUP SPEED -->
    <div class="dv-pop" id="pop-speed">
        <div class="pop-title">Vitesse</div>
        <button class="pop-opt" onclick="setSpeed(0.25)"><span class="chk"></span>0.25×</button>
        <button class="pop-opt" onclick="setSpeed(0.5)"><span class="chk"></span>0.5×</button>
        <button class="pop-opt" onclick="setSpeed(0.75)"><span class="chk"></span>0.75×</button>
        <button class="pop-opt active" onclick="setSpeed(1)"><span class="chk" id="chk-1x"></span>1× <span class="bdg">Normal</span></button>
        <button class="pop-opt" onclick="setSpeed(1.25)"><span class="chk"></span>1.25×</button>
        <button class="pop-opt" onclick="setSpeed(1.5)"><span class="chk"></span>1.5×</button>
        <button class="pop-opt" onclick="setSpeed(2)"><span class="chk"></span>2×</button>
    </div>

    <!-- POPUP QUALITY -->
    <div class="dv-pop" id="pop-quality">
        <div class="pop-title">Qualité</div>
        <button class="pop-opt" onclick="setQuality(this,'4K','2160p')"><span class="chk"></span>4K <span class="bdg">2160p</span></button>
        <button class="pop-opt" onclick="setQuality(this,'2K','1440p')"><span class="chk"></span>2K <span class="bdg">1440p</span></button>
        <button class="pop-opt" onclick="setQuality(this,'FHD','1080p')"><span class="chk"></span>FHD <span class="bdg">1080p</span></button>
        <button class="pop-opt" onclick="setQuality(this,'HD','720p')"><span class="chk"></span>HD <span class="bdg">720p</span></button>
        <button class="pop-opt" onclick="setQuality(this,'SD','480p')"><span class="chk"></span>SD <span class="bdg">480p</span></button>
        <button class="pop-opt active" id="q-auto" onclick="setQuality(this,'Auto','auto')">
            <span class="chk" id="chk-auto"></span>Auto <span class="bdg">AVC</span>
        </button>
    </div>

    <!-- ══ BARRE DE CONTRÔLE ══ -->
    <div id="dv-bar">

        <!-- SEEK -->
        <div class="seek-row">
            <input type="range" id="dv-seek" min="0" max="100" value="0" step="0.1">
            <span id="dv-time">0:00 / 0:00</span>
        </div>

        <!-- BOUTONS PRINCIPAUX -->
        <div class="btn-row">

            <button class="pill ico" id="btn-play" onclick="togglePlay()">
                <svg id="ico-play"  width="18" height="18" viewBox="0 0 24 24" class="f"><path d="M6 4l14 8-14 8V4z"/></svg>
                <svg id="ico-pause" width="18" height="18" viewBox="0 0 24 24" class="f" style="display:none"><rect x="5" y="4" width="4" height="16" rx="1.5"/><rect x="15" y="4" width="4" height="16" rx="1.5"/></svg>
            </button>

            <button class="pill ico" onclick="seekBy(-10)">
                <svg width="18" height="18" viewBox="0 0 24 24" class="s">
                    <path d="M2.5 12a9.5 9.5 0 1 1 1.1 4.4"/>
                    <polyline points="2 7 2.5 12 7 11.5"/>
                    <text x="8" y="16" font-size="6" fill="rgba(255,255,255,0.8)" stroke="none" font-family="Outfit,sans-serif" font-weight="700">10</text>
                </svg>
            </button>

            <button class="pill ico" onclick="seekBy(10)">
                <svg width="18" height="18" viewBox="0 0 24 24" class="s">
                    <path d="M21.5 12a9.5 9.5 0 1 0-1.1 4.4"/>
                    <polyline points="22 7 21.5 12 17 11.5"/>
                    <text x="8" y="16" font-size="6" fill="rgba(255,255,255,0.8)" stroke="none" font-family="Outfit,sans-serif" font-weight="700">10</text>
                </svg>
            </button>

            <!-- Volume -->
            <div class="range-pill">
                <button class="pill ico" onclick="toggleMute()" style="border:none;background:none;backdrop-filter:none;padding:2px 3px;">
                    <svg id="ico-vol"  width="17" height="17" viewBox="0 0 24 24" class="s"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    <svg id="ico-mute" width="17" height="17" viewBox="0 0 24 24" class="s" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
                <input type="range" id="dv-vol-range" min="0" max="1" step="0.05" value="1">
            </div>

            <!-- Luminosité -->
            <div class="range-pill">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,210,100,0.65)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <input type="range" id="dv-bright-range" min="0" max="0.8" step="0.05" value="0">
            </div>

            <div class="spc"></div>

            <!-- PiP -->
            <button class="pill ico" id="btn-pip" onclick="togglePiP()">
                <svg width="17" height="17" viewBox="0 0 24 24" class="s">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <rect x="13" y="12" width="8" height="6" rx="1" fill="rgba(255,255,255,0.8)" stroke="none"/>
                </svg>
            </button>

            <!-- Vitesse -->
            <button class="pill" id="btn-speed" onclick="togglePop('pop-speed')">
                <svg width="15" height="15" viewBox="0 0 24 24" class="s"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span id="lbl-speed">1×</span>
            </button>

            <!-- Qualité -->
            <button class="pill" id="btn-qual" onclick="togglePop('pop-quality')">
                <svg width="15" height="15" viewBox="0 0 24 24" class="s"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span id="lbl-qual">Auto</span>
            </button>

            <!-- Télécharger -->
            <button class="pill ico" onclick="doDownload()">
                <svg width="17" height="17" viewBox="0 0 24 24" class="s"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>

            <!-- Plein écran -->
            <button class="pill ico" onclick="toggleFS()">
                <svg id="ico-fs-e" width="17" height="17" viewBox="0 0 24 24" class="s"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                <svg id="ico-fs-c" width="17" height="17" viewBox="0 0 24 24" class="s" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
            </button>
        </div>

        <!-- AUDIO + SOUS-TITRES -->
        <div class="lang-row">

            <span class="row-lbl">Audio</span>

            <!-- VOSTFR -->
            <button class="audio-pill active has-src" id="bar-vostfr" onclick="switchAudio('VOSTFR')">
                <span class="avail-dot"></span>
                <svg width="12" height="12" viewBox="0 0 24 24" class="s" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/></svg>
                VOSTFR
            </button>

            <!-- VF -->
            <button class="audio-pill" id="bar-vf" onclick="switchAudio('VF')">
                <span class="avail-dot"></span>
                <svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/></svg>
                VF
            </button>

            <!-- VO -->
            <button class="audio-pill" id="bar-vo" onclick="switchAudio('VO')">
                <span class="avail-dot"></span>
                <svg width="12" height="12" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"/></svg>
                VO
            </button>

            <div class="row-sep"></div>

            <span class="row-lbl">Sous-titres</span>
            <button class="pill active" id="sub-fr"  onclick="switchSub(this,'fr')">
                <svg width="12" height="12" viewBox="0 0 24 24" class="s"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="6" y1="15" x2="9" y2="15"/><line x1="14" y1="12" x2="18" y2="12"/><line x1="14" y1="15" x2="17" y2="15"/></svg>
                FR
            </button>
            <button class="pill" id="sub-en" onclick="switchSub(this,'en')">
                <svg width="12" height="12" viewBox="0 0 24 24" class="s"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="6" y1="15" x2="9" y2="15"/><line x1="14" y1="12" x2="18" y2="12"/><line x1="14" y1="15" x2="17" y2="15"/></svg>
                EN
            </button>
            <button class="pill" id="sub-off" onclick="switchSub(this,'off')">
                <svg width="12" height="12" viewBox="0 0 24 24" class="s"><rect x="2" y="6" width="20" height="13" rx="2"/><line x1="2" y1="6" x2="22" y2="19" stroke-width="2"/></svg>
                OFF
            </button>
        </div>

    </div>
</div>

<script>
/* ════════════════════════════════════════
   DAVIDEO.NET — Multi-source Audio Player
   OtAkU+ Integration v3
   ════════════════════════════════════════ */

const vid       = document.getElementById('dv-video');
const seekEl    = document.getElementById('dv-seek');
const timeEl    = document.getElementById('dv-time');
const volEl     = document.getElementById('dv-vol-range');
const brightEl  = document.getElementById('dv-bright-range');
const brightOv  = document.getElementById('dv-bright-ov');
const loader    = document.getElementById('dv-loader');
const loaderTxt = document.getElementById('loader-txt');
const errBanner = document.getElementById('dv-error');
const placeholder = document.getElementById('dv-placeholder');

/* ── État global ── */
const STATE = {
    sources  : { VOSTFR: null, VF: null, VO: null },
    headers  : {},
    currentLang : 'VOSTFR',
    savedTime : 0,
    poster   : ''
};

let hlsInst  = null;
let dashInst = null;

/* ════════════════════════════════════════
   API PRINCIPALE — appelée par OtAkU+
   ════════════════════════════════════════ */
window.loadSrc = function(src, options = {}) {
    /*
      options = {
        sources : {
          VOSTFR : 'https://url-vostfr.m3u8',   ← piste japonaise sous-titrée
          VF     : 'https://url-vf.mp4',         ← doublage français
          VO     : 'https://url-vo.m3u8'         ← version originale
        },
        lang    : 'VOSTFR'|'VF'|'VO',    ← langue par défaut
        type    : 'auto'|'m3u8'|'mp4'|'mpd',
        headers : { 'Referer': '...' },
        poster  : 'https://img.jpg',
        startAt : 0
      }

      Si "sources" n'est pas fourni, on utilise "src" pour toutes les pistes.
    */

    placeholder.style.display = 'none';
    showError(false);

    // Enregistrer les sources
    if (options.sources) {
        STATE.sources.VOSTFR = options.sources.VOSTFR || null;
        STATE.sources.VF     = options.sources.VF     || null;
        STATE.sources.VO     = options.sources.VO     || null;
    } else {
        // Source unique — disponible pour toutes les pistes
        STATE.sources.VOSTFR = src || null;
        STATE.sources.VF     = null;
        STATE.sources.VO     = null;
    }

    STATE.headers  = options.headers || {};
    STATE.poster   = options.poster  || '';
    STATE.savedTime = options.startAt || 0;

    if (STATE.poster) vid.poster = STATE.poster;

    // Mettre à jour les indicateurs de disponibilité
    updateLangAvailability();

    // Choisir la langue de départ
    const startLang = options.lang || 'VOSTFR';
    loadLang(startLang, true);
};

/* ════════════════════════════════════════
   CHARGEMENT D'UNE PISTE AUDIO
   ════════════════════════════════════════ */
function loadLang(lang, isFirst = false) {
    const src = STATE.sources[lang];

    if (!src) {
        showLangToast(lang, false);
        showError(true, `Piste ${lang} non disponible`);
        return;
    }

    // Sauvegarder la position actuelle
    if (!isFirst && vid.currentTime > 2) {
        STATE.savedTime = vid.currentTime;
    }

    STATE.currentLang = lang;
    updateLangUI(lang);
    showLangToast(lang, true);
    showLoader(true, `Chargement ${lang}...`);

    destroyInstances();

    const type = detectType(src);

    if (type === 'm3u8') {
        loadHLS(src);
    } else if (type === 'mpd') {
        loadDASH(src);
    } else {
        loadNative(src);
    }
}

/* ── Détection type ── */
function detectType(src) {
    if (!src) return 'mp4';
    if (src.includes('.m3u8') || src.includes('m3u8')) return 'm3u8';
    if (src.includes('.mpd')  || src.includes('mpd'))  return 'mpd';
    if (src.includes('.webm')) return 'webm';
    return 'mp4';
}

/* ── HLS ── */
function loadHLS(src) {
    if (Hls.isSupported()) {
        hlsInst = new Hls({
            xhrSetup: xhr => {
                Object.entries(STATE.headers).forEach(([k,v]) => {
                    try { xhr.setRequestHeader(k, v); } catch(e) {}
                });
            }
        });
        hlsInst.loadSource(src);
        hlsInst.attachMedia(vid);
        hlsInst.on(Hls.Events.MANIFEST_PARSED, onReady);
        hlsInst.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) { showLoader(false); showError(true); }
        });
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
        loadNative(src); // Safari
    } else {
        showError(true); showLoader(false);
    }
}

/* ── DASH ── */
function loadDASH(src) {
    if (window.dashjs) {
        dashInst = dashjs.MediaPlayer().create();
        dashInst.initialize(vid, src, false);
        dashInst.on(dashjs.MediaPlayer.events.PLAYBACK_METADATA_LOADED, onReady);
        dashInst.on(dashjs.MediaPlayer.events.ERROR, () => { showError(true); showLoader(false); });
    } else { showError(true); showLoader(false); }
}

/* ── Native ── */
function loadNative(src) {
    vid.src = src;
    vid.load();
    vid.addEventListener('canplay', onReady, { once: true });
    vid.addEventListener('error',   () => { showError(true); showLoader(false); }, { once: true });
}

/* ── Prêt à jouer ── */
function onReady() {
    showLoader(false);
    if (STATE.savedTime > 2) vid.currentTime = STATE.savedTime;
    vid.play().catch(() => {});
}

/* ── Détruire les instances ── */
function destroyInstances() {
    if (hlsInst)  { hlsInst.destroy(); hlsInst = null; }
    if (dashInst) { try { dashInst.reset(); } catch(e){} dashInst = null; }
    vid.removeAttribute('src');
    vid.load();
}

/* ════════════════════════════════════════
   SWITCH AUDIO — bouton VOSTFR / VF / VO
   ════════════════════════════════════════ */
function switchAudio(lang) {
    if (lang === STATE.currentLang) return;
    if (!STATE.sources[lang]) {
        showError(true, `Piste ${lang} non disponible pour cet anime`);
        return;
    }
    loadLang(lang, false);
    // Notifier OtAkU+
    if (window.parent !== window) {
        window.parent.postMessage({ type: 'davideo:lang', lang }, '*');
    }
}

/* ── Mettre à jour les boutons langue ── */
function updateLangUI(activeLang) {
    const map = {
        VOSTFR : ['badge-vostfr', 'bar-vostfr'],
        VF     : ['badge-vf',     'bar-vf'],
        VO     : ['badge-vo',     'bar-vo']
    };
    Object.entries(map).forEach(([lang, ids]) => {
        ids.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('active', lang === activeLang);
        });
    });
}

/* ── Indicateurs de disponibilité (point vert / gris) ── */
function updateLangAvailability() {
    const pairs = [
        ['VOSTFR', 'badge-vostfr', 'bar-vostfr'],
        ['VF',     'badge-vf',     'bar-vf'],
        ['VO',     'badge-vo',     'bar-vo']
    ];
    pairs.forEach(([lang, badgeId, barId]) => {
        const has = !!STATE.sources[lang];
        // Badge top-left
        const badge = document.getElementById(badgeId);
        if (badge) {
            badge.classList.toggle('unavail', !has);
            badge.classList.toggle('has-src', has);
        }
        // Barre du bas
        const bar = document.getElementById(barId);
        if (bar) {
            bar.classList.toggle('unavail', !has);
            bar.classList.toggle('has-src', has);
        }
    });
}

/* ── Toast de changement de langue ── */
let toastTimer;
function showLangToast(lang, success) {
    const toast = document.getElementById('lang-toast');
    const icons = { VOSTFR:'🇯🇵', VF:'🇫🇷', VO:'🌐' };
    const labels = { VOSTFR:'VOSTFR', VF:'VF — Français', VO:'VO — Original' };

    document.getElementById('lt-icon').textContent  = icons[lang]  || '🌐';
    document.getElementById('lt-label').textContent = labels[lang] || lang;
    document.getElementById('lt-sub').textContent   = success ? 'Chargement de la piste...' : 'Piste non disponible';

    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ════════════════════════════════════════
   ÉCOUTE MESSAGES — OtAkU+ → iframe
   ════════════════════════════════════════ */
window.addEventListener('message', e => {
    const d = e.data;
    if (!d) return;

    if (d.type === 'davideo:load') {
        window.loadSrc(d.src || (d.sources && Object.values(d.sources)[0]), {
            sources : d.sources || {},
            type    : d.mimeType || 'auto',
            headers : d.headers  || {},
            poster  : d.poster   || '',
            lang    : d.lang     || 'VOSTFR',
            startAt : d.startAt  || 0
        });
    }

    if (d.type === 'davideo:switchLang') {
        switchAudio(d.lang);
    }
});

/* ════════════════════════════════════════
   PARAMS URL — chargement direct
   ?src=URL&vf=URL2&vo=URL3&lang=VOSTFR
   ════════════════════════════════════════ */
(function checkURL() {
    const p = new URLSearchParams(window.location.search);
    const src = p.get('src');
    if (src) {
        window.loadSrc(src, {
            sources : {
                VOSTFR : src,
                VF     : p.get('vf')  || null,
                VO     : p.get('vo')  || null
            },
            lang    : p.get('lang')   || 'VOSTFR',
            poster  : p.get('poster') || '',
            startAt : parseFloat(p.get('t') || 0)
        });
    }
})();

/* ════════════════════════════════════════
   CONTRÔLES
   ════════════════════════════════════════ */

/* Play/Pause */
function togglePlay() { vid.paused ? vid.play().catch(()=>{}) : vid.pause(); }
vid.addEventListener('click', togglePlay);
vid.addEventListener('play',  () => { document.getElementById('ico-play').style.display='none';  document.getElementById('ico-pause').style.display='block'; });
vid.addEventListener('pause', () => { document.getElementById('ico-play').style.display='block'; document.getElementById('ico-pause').style.display='none';  });
vid.addEventListener('ended', () => {
    document.getElementById('ico-play').style.display='block';
    document.getElementById('ico-pause').style.display='none';
    if (window.parent !== window) window.parent.postMessage({ type:'davideo:ended', lang: STATE.currentLang }, '*');
});

/* Seek */
vid.addEventListener('timeupdate', () => {
    if (!vid.duration) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    seekEl.value = pct;
    seekEl.style.background = `linear-gradient(to right,#ff8c00 ${pct}%,rgba(255,255,255,0.18) ${pct}%)`;
    timeEl.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
    localStorage.setItem('dv_pos', vid.currentTime);
});
seekEl.addEventListener('input', () => { vid.currentTime = (seekEl.value / 100) * vid.duration; });
function seekBy(s) { vid.currentTime = Math.max(0, vid.currentTime + s); }
const fmt = s => isNaN(s)||s<0 ? '0:00' : Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* Volume */
volEl.addEventListener('input', () => { vid.volume = volEl.value; vid.muted = volEl.value == 0; updVol(); });
function toggleMute() { vid.muted = !vid.muted; updVol(); }
function updVol() {
    const m = vid.muted || vid.volume === 0;
    document.getElementById('ico-vol').style.display  = m ? 'none'  : 'block';
    document.getElementById('ico-mute').style.display = m ? 'block' : 'none';
}

/* Brightness */
brightEl.addEventListener('input', () => { brightOv.style.opacity = brightEl.value; });

/* Popups */
function togglePop(id) {
    const el = document.getElementById(id);
    const was = el.classList.contains('open');
    document.querySelectorAll('.dv-pop').forEach(p => p.classList.remove('open'));
    if (!was) el.classList.add('open');
}
document.addEventListener('click', e => {
    if (!e.target.closest('.dv-pop') && !e.target.closest('#btn-speed') && !e.target.closest('#btn-qual'))
        document.querySelectorAll('.dv-pop').forEach(p => p.classList.remove('open'));
});

/* Speed */
function setSpeed(s) {
    vid.playbackRate = s;
    document.getElementById('lbl-speed').textContent = s + '×';
    document.querySelectorAll('#pop-speed .pop-opt').forEach(b => {
        const on = b.textContent.trim().startsWith(s + '×');
        b.classList.toggle('active', on);
        b.querySelector('.chk').innerHTML = on ? chkSVG() : '';
    });
    document.getElementById('pop-speed').classList.remove('open');
}

/* Quality */
function setQuality(btn, lbl, res) {
    document.getElementById('lbl-qual').textContent = lbl;
    document.querySelectorAll('#pop-quality .pop-opt').forEach(b => {
        b.classList.toggle('active', b === btn);
        b.querySelector('.chk').innerHTML = (b === btn) ? chkSVG() : '';
    });
    document.getElementById('pop-quality').classList.remove('open');
    if (window.parent !== window) window.parent.postMessage({ type:'davideo:quality', res }, '*');
}

function chkSVG() { return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ff8c00" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`; }

/* PiP */
async function togglePiP() {
    const badge = document.getElementById('pip-badge');
    const btn   = document.getElementById('btn-pip');
    if (document.pictureInPictureElement) {
        await document.exitPictureInPicture();
        badge.classList.remove('show'); btn.classList.remove('active');
    } else if (document.pictureInPictureEnabled && vid.src) {
        try { await vid.requestPictureInPicture(); badge.classList.add('show'); btn.classList.add('active'); }
        catch(e) {}
    }
}
vid.addEventListener('leavepictureinpicture', () => {
    document.getElementById('pip-badge').classList.remove('show');
    document.getElementById('btn-pip').classList.remove('active');
});

/* Fullscreen */
const wrap = document.getElementById('dv-wrap');
function toggleFS() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement)
        (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    else
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
document.addEventListener('fullscreenchange', () => {
    const fs = !!document.fullscreenElement;
    document.getElementById('ico-fs-e').style.display = fs ? 'none'  : 'block';
    document.getElementById('ico-fs-c').style.display = fs ? 'block' : 'none';
});

/* Download */
function doDownload() {
    const a = document.createElement('a');
    a.href = vid.currentSrc; a.download = ''; a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* Subtitles */
function switchSub(btn, lang) {
    document.querySelectorAll('#sub-fr,#sub-en,#sub-off').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    for (let t of vid.textTracks) t.mode = (t.language === lang) ? 'showing' : 'hidden';
    if (lang === 'off') for (let t of vid.textTracks) t.mode = 'hidden';
}

/* Keyboard */
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') { seekBy(10); }
    if (e.code === 'ArrowLeft')  { seekBy(-10); }
    if (e.code === 'ArrowUp')    { vid.volume = Math.min(1, vid.volume + 0.1); volEl.value = vid.volume; }
    if (e.code === 'ArrowDown')  { vid.volume = Math.max(0, vid.volume - 0.1); volEl.value = vid.volume; }
    if (e.code === 'KeyM')       { toggleMute(); }
    if (e.code === 'KeyF')       { toggleFS(); }
    if (e.code === 'KeyP')       { togglePiP(); }
    if (e.code === 'Digit1')     { switchAudio('VOSTFR'); }
    if (e.code === 'Digit2')     { switchAudio('VF'); }
    if (e.code === 'Digit3')     { switchAudio('VO'); }
});

/* UI helpers */
function showLoader(v, txt = 'Chargement...') {
    loader.classList.toggle('show', v);
    loaderTxt.textContent = txt;
}
function showError(v, msg = '⚠ Source indisponible — essaie une autre piste') {
    errBanner.textContent = msg;
    errBanner.classList.toggle('show', v);
    if (v) setTimeout(() => errBanner.classList.remove('show'), 4000);
}

/* Init checkmarks */
document.getElementById('chk-1x')?.insertAdjacentHTML('afterbegin', chkSVG());
document.getElementById('chk-auto')?.insertAdjacentHTML('afterbegin', chkSVG());
</script>
</body>
</html>
